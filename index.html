<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking</title>
    <link rel="stylesheet" href="speaking.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">
</head>
<body>
    <div class="lesson-container" id="lessonContainer">
        <div class="lesson-list-container" id="lessonListContainer"></div>
        <div class="practice-container" id="practiceContainer"></div>
        <div class="voice-record-container" id="voiceRecordContainer">
            <div class="score-container" id="scoreContainer">
               <div class="score-box" id="scoreBox">Score</div>
               <div class="pactice-mode" id="practiceMode">Mode</div>
            </div>
            <div class="record-text-container" id="recordTextContainer">
                <p class="record-text" id="recordText">Hi!</p>
            </div>
            <div class="record-button-container" id="recordButtonContainer">
                <button class="record-button" id="recordButton"></button>
            </div>
        </div>
    </div>
   <script src="speaking.js"></script>
</body>

</html>
